<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
  </defs>

  <rect width="1200" height="620" rx="20" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">唯一金额匹配</text>
  <text x="600" y="72" text-anchor="middle" font-size="15" fill="#64748b">同时有多笔相同金额的订单时，每单加一个不重复的尾数，到账后按「金额 + 时间」对上号</text>

  <!-- column headers -->
  <g font-size="15" font-weight="700" fill="#475569" text-anchor="middle">
    <text x="230" y="118">商户下单金额</text>
    <text x="590" y="118">收银台应付（自动加尾数）</text>
    <text x="970" y="118">支付宝账务流水</text>
  </g>

  <g font-size="17" text-anchor="middle">
    <!-- order A -->
    <rect x="90" y="135" width="280" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="230" y="166" fill="#334155">订单 A · ¥10.00</text>
    <line x1="374" y1="160" x2="484" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#m-gray)"/>
    <rect x="490" y="135" width="200" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="590" y="166" fill="#334155">¥10.01</text>

    <!-- order B (matched) -->
    <rect x="90" y="205" width="280" height="50" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
    <text x="230" y="236" fill="#047857" font-weight="700">订单 B · ¥10.00</text>
    <line x1="374" y1="230" x2="484" y2="230" stroke="#059669" stroke-width="2.5" marker-end="url(#m-ok)"/>
    <rect x="490" y="205" width="200" height="50" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
    <text x="590" y="236" fill="#047857" font-weight="700">¥10.02</text>

    <!-- order C -->
    <rect x="90" y="275" width="280" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="230" y="306" fill="#334155">订单 C · ¥10.00</text>
    <line x1="374" y1="300" x2="484" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#m-gray)"/>
    <rect x="490" y="275" width="200" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="590" y="306" fill="#334155">¥10.03</text>

    <!-- alipay record -->
    <rect x="830" y="195" width="280" height="70" rx="10" fill="#e0edff" stroke="#1677ff" stroke-width="2.5"/>
    <text x="970" y="225" fill="#0958d9" font-weight="700">收入 +¥10.02</text>
    <text x="970" y="250" font-size="14" fill="#0958d9">14:30:12 · 订单 B 创建后 40 秒</text>
    <line x1="826" y1="230" x2="696" y2="230" stroke="#059669" stroke-width="2.5" marker-end="url(#m-ok)"/>
    <text x="760" y="218" font-size="15" font-weight="700" fill="#047857">匹配 ✓</text>
  </g>

  <text x="600" y="360" text-anchor="middle" font-size="14" fill="#64748b">尾数 0.01–0.99 元，按订单分配不重复；回调给网站的 money 仍是原价 ¥10.00</text>

  <!-- timeline -->
  <line x1="60" y1="395" x2="1140" y2="395" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="600" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">订单时间窗口</text>

  <g font-size="16" text-anchor="middle">
    <rect x="80" y="460" width="400" height="50" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="280" y="491" fill="#047857" font-weight="700">收银台有效 · 付款即 paid</text>
    <rect x="480" y="460" width="400" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="680" y="491" fill="#b45309" font-weight="700">late_paid · 仍正常通知</text>
    <rect x="880" y="460" width="240" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="1000" y="491" fill="#475569" font-weight="700">停止匹配 · 过期</text>
  </g>
  <g font-size="14" fill="#475569" text-anchor="middle">
    <line x1="80" y1="512" x2="80" y2="524" stroke="#94a3b8" stroke-width="2"/>
    <text x="80" y="542">下单</text>
    <line x1="480" y1="512" x2="480" y2="524" stroke="#94a3b8" stroke-width="2"/>
    <text x="480" y="542">5 分钟</text>
    <line x1="880" y1="512" x2="880" y2="524" stroke="#94a3b8" stroke-width="2"/>
    <text x="880" y="542">10 分钟</text>
  </g>
  <text x="600" y="585" text-anchor="middle" font-size="14" fill="#64748b">收银台倒计时 5 分钟；AliMPay 继续扫账到下单后第 10 分钟，对易支付接口仍返回 status=1</text>
</svg>
